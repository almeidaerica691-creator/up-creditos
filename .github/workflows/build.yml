name: Gerar APK Android

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descarregar Código via Git Direto
        run: |
          git init
          git remote add origin https://github.com/almeidaerica691-criador/up-creditos.git
          git fetch origin principal
          git checkout origin/principal

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter Manualmente
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

      - name: Obter dependências
        run: flutter pub get

      - name: Construir APK Release
        run: flutter build apk --release

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

